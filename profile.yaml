# Candidate profile used by scripts/enrich.py to judge HARD gates (not keywords).
# Edit this file; every verdict in the tracker follows from it.
# Updated 2026-10-10 on the candidate's instruction.

paid_experience_years: 4.0          # candidate: "3.5, technically 3.8, keep it close to 4". Resume dates alone compute to ~3.3 (40 mo); screeners may count less.
consulting_experience_years: 2.75   # EasyRewardz 27 mo + Convergytics 6 mo, IF a screener accepts both as advisory. Contested.
years_risk_margin: 0                # asks <= 4 yrs -> CLEAR; above -> BLOCKED. A 5-yr ask is listed as "stretch" in reports, never auto-cleared.

# --- work authorisation ---
work_authorised: [India]
# Rule (candidate, 2026-10-29, replaces 2026-10-10): geography is never a gate by itself. Countries below are RISK
# (verify the route), never BLOCKED on country alone. A role is BLOCKED only by the JD itself: no-sponsorship /
# right-to-work wording, a required language not held, or a JD written in another language.
assume_sponsorship_available: true
sponsorship_verify_countries:       # strict, salary-threshold visa regimes: verify employer + threshold before building
  [united kingdom, uk, england, scotland, wales, united states, united states of america, usa, us, canada, australia, new zealand, ireland]
local_language_countries:           # local working language is not English; many consulting roles still run in English, so the JD decides
  [germany, france, netherlands, belgium, poland, italy, switzerland, spain, portugal, austria, greece, sweden, norway, denmark, finland,
   czechia, czech republic, hungary, slovakia, latvia, romania, luxembourg, japan, china, south korea, korea, thailand, vietnam, indonesia, taiwan,
   brazil, argentina, mexico, chile, colombia, peru, kazakhstan, russia, turkey]
sponsorship_routes:                 # route to verify, shown on the row. Names only: look up current thresholds/fees at the source.
  united kingdom: "Skilled Worker only (Graduate Route closed): employer on gov.uk sponsor register + going-rate salary"
  united states: "H-1B lottery (check current USCIS rules and fees for petitions from abroad) or L-1 after 1 yr at the firm's India arm"
  ireland: "Critical Skills / General Employment Permit: check enterprise.gov.ie occupation lists + salary floor"
  canada: "employer LMIA or Express Entry: verify on canada.ca"
  australia: "Skills in Demand (employer-sponsored): verify on homeaffairs.gov.au"
  new zealand: "Accredited Employer Work Visa: employer must be accredited (immigration.govt.nz)"
  netherlands: "Highly Skilled Migrant: employer must be an IND recognised sponsor (ind.nl register) + salary threshold"
  _local_language: "EU Blue Card or national permit: check salary threshold; confirm English is the working language"
sponsorship_friendly_countries:     # sponsorship assumed available; English works as business language
  [uae, united arab emirates, saudi arabia, qatar, kuwait, bahrain, oman, jordan, lebanon, singapore, hong kong, malaysia, philippines,
   south africa, mauritius, malta, cyprus, bermuda, bahamas]
# Anything not in a list above (e.g. Pakistan, "Multiple (N countries)") is RISK: classify it here once decided.

languages: [English]                # English only (advanced). Hindi NOT claimed.
highest_degree: Master              # MBA, Swansea University, 2024-2025 (Outstanding Excellence); completed Dec 2025
degrees: ["MBA (Swansea, 2024-25)", "PG Diploma (IIIT Bangalore, 2020-21)", "B.Tech Electrical Engineering (DIT University, 2019)", "Exec programme (IIT Patna, 2025-26)"]
certifications: ["Adobe Experience Cloud"]   # CFA/CA/CPA/ACCA/PMP etc. NOT held
graduated: "2025-12"                # most recent graduation (MBA). Early-careers roles are fine unless the JD requires FUTURE graduation / current student.
pedigree_note: "MBA is not a top-tier school; BCG/MBB pedigree gap recorded in decisions/log.md."
